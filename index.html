<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anime katalog</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0c0b1f; --surface:#17163a; --surface2:#201e4b; --line:#2d2a63; --text:#f3f2ff; --muted:#a9a7d6;
  --accent:#ff8a1f; --on-accent:#1a1030;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f5f4ff;--surface:#ffffff;--surface2:#ecebff;--line:#d9d7f5;--text:#1b1a3a;--muted:#5d5b8c}
}
:root[data-theme="light"]{--bg:#f5f4ff;--surface:#ffffff;--surface2:#ecebff;--line:#d9d7f5;--text:#1b1a3a;--muted:#5d5b8c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:20px;font-weight:800;letter-spacing:.01em}
h1 b{color:var(--accent)}
.count{font-size:13px;color:var(--muted)}
.search{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:focus-visible,.card:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:14px 16px 28px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{display:block;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;padding:0}
.poster{aspect-ratio:3/4;width:100%;display:block;object-fit:cover;background:linear-gradient(160deg,#3b2f8f,#ff8a1f)}
.ph{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:#fff;background:linear-gradient(160deg,#3b2f8f,#ff8a1f)}
.info{padding:10px 12px 12px}
.name{font-size:15px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.meta{margin-top:6px;font-size:12.5px;color:var(--muted);display:flex;gap:10px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:16px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--line);max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.row{display:flex;gap:14px}
.row .poster,.row .ph{width:112px;flex:none;border-radius:14px;aspect-ratio:3/4;font-size:40px}
.row h2{font-size:20px;line-height:1.2;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.desc{margin-top:14px;font-size:15px;line-height:1.5;color:var(--muted);white-space:pre-line}
.btn{display:block;width:100%;margin-top:18px;text-align:center;text-decoration:none;font:inherit;font-size:17px;font-weight:800;padding:15px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.close{position:absolute;right:14px;top:12px;font:inherit;font-size:22px;line-height:1;background:transparent;border:0;color:var(--muted);padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="top"><h1>ANIME <b>katalog</b></h1><span class="count" id="count"></span></div>
  <input class="search" id="q" type="search" placeholder="Anime nomi yoki kodi" autocomplete="off" aria-label="Qidirish">
  <div class="chips" id="chips" role="tablist"></div>
</header>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden></div></main>

<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Anime haqida">
  <button class="close" id="close" aria-label="Yopish">✕</button>
  <div class="grab"></div>
  <div id="detail"></div>
</div>

<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  try { if (tg) { tg.ready(); tg.expand(); if (tg.colorScheme) document.documentElement.setAttribute('data-theme', tg.colorScheme); } } catch(e){}
  var DATA = {bot:"", anime:[]};
  var state = {q:"", genre:"", sort:"new"};
  var grid = document.getElementById("grid"), chips = document.getElementById("chips"),
      empty = document.getElementById("empty"), count = document.getElementById("count");

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function genres(a){return (a.genre||"").split(",").map(function(x){return x.trim();}).filter(Boolean);}
  function poster(a, cls){
    if (a.poster) return '<img class="'+cls+'" loading="lazy" alt="'+esc(a.title)+'" src="'+esc(a.poster)+'">';
    return '<div class="ph">'+esc((a.title||"?").charAt(0).toUpperCase())+'</div>';
  }

  function allGenres(){
    var m = {};
    DATA.anime.forEach(function(a){genres(a).forEach(function(g){m[g]=(m[g]||0)+1;});});
    return Object.keys(m).sort();
  }
  function renderChips(){
    var items = [["new","Yangi"],["top","🏆 Top"]];
    var h = "";
    items.forEach(function(it){
      h += '<button type="button" class="chip'+(state.sort===it[0]&&!state.genre?" on":"")+'" data-sort="'+it[0]+'">'+it[1]+'</button>';
    });
    allGenres().forEach(function(g){
      h += '<button type="button" class="chip'+(state.genre===g?" on":"")+'" data-genre="'+esc(g)+'">'+esc(g)+'</button>';
    });
    chips.innerHTML = h;
  }
  function list(){
    var q = state.q.trim().toLowerCase().replace(/^#/,"");
    var r = DATA.anime.filter(function(a){
      if (state.genre && genres(a).indexOf(state.genre)<0) return false;
      if (!q) return true;
      return String(a.id)===q || (a.title||"").toLowerCase().indexOf(q)>=0;
    });
    if (state.sort==="top") r.sort(function(a,b){return (b.views||0)-(a.views||0) || b.id-a.id;});
    else r.sort(function(a,b){return b.id-a.id;});
    return r;
  }
  function render(){
    renderChips();
    var r = list();
    count.textContent = DATA.anime.length ? DATA.anime.length+" ta anime" : "";
    grid.innerHTML = r.map(function(a){
      return '<button type="button" class="card" data-id="'+a.id+'">'+poster(a,"poster")+
        '<div class="info"><div class="name">'+esc(a.title)+'</div>'+
        '<div class="meta"><span>🎞 '+(a.eps||0)+'</span><span>👁 '+(a.views||0)+'</span></div></div></button>';
    }).join("");
    if (!r.length){
      empty.hidden = false;
      empty.textContent = DATA.anime.length ? "Hech narsa topilmadi" : "Katalog hozircha bo'sh";
    } else empty.hidden = true;
  }

  var sheet = document.getElementById("sheet"), bg = document.getElementById("bg"), detail = document.getElementById("detail");
  function link(id){return "https://t.me/"+DATA.bot+"?start=a"+id;}
  function openSheet(id){
    var a = DATA.anime.filter(function(x){return x.id==id;})[0]; if(!a) return;
    detail.innerHTML =
      '<div class="row">'+poster(a,"poster")+'<div><h2>'+esc(a.title)+'</h2>'+
      '<div class="tags"><span class="tag">🆔 '+a.id+'</span><span class="tag">🎞 '+(a.eps||0)+' qism</span><span class="tag">👁 '+(a.views||0)+'</span>'+
      genres(a).map(function(g){return '<span class="tag">'+esc(g)+'</span>';}).join("")+'</div></div></div>'+
      (a.descr?'<p class="desc">'+esc(a.descr)+'</p>':"")+
      '<a class="btn" id="watch" href="'+link(a.id)+'">▶️ Botda ko\'rish</a>';
    document.getElementById("watch").onclick = function(e){
      if (tg && tg.openTelegramLink){ e.preventDefault(); tg.openTelegramLink(link(a.id)); }
    };
    sheet.classList.add("open"); bg.classList.add("open");
  }
  function closeSheet(){sheet.classList.remove("open"); bg.classList.remove("open");}

  grid.addEventListener("click", function(e){
    var c = e.target.closest(".card"); if (c) openSheet(c.getAttribute("data-id"));
  });
  chips.addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if(!b) return;
    if (b.hasAttribute("data-genre")) { var g=b.getAttribute("data-genre"); state.genre = state.genre===g ? "" : g; }
    else { state.sort = b.getAttribute("data-sort"); state.genre = ""; }
    render();
  });
  document.getElementById("q").addEventListener("input", function(e){state.q = e.target.value; render();});
  document.getElementById("close").onclick = closeSheet; bg.onclick = closeSheet;
  document.addEventListener("keydown", function(e){if(e.key==="Escape") closeSheet();});

  fetch("anime.json?t="+Date.now()).then(function(r){return r.json();}).then(function(j){
    DATA = j; render();
  }).catch(function(){
    empty.hidden = false; empty.textContent = "Katalogni yuklab bo'lmadi. Keyinroq urinib ko'ring."; render();
  });
  render();
})();
</script>
</body>
</html>
